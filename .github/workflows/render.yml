name: Render poster

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render poster.qmd
        run: quarto render poster.qmd

      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Check page count and size
        run: |
          pdfinfo poster.pdf | tee info.txt
          grep -qE '^Pages:\s+1$' info.txt || { echo "::error::poster.pdf is not exactly one page (text overflowed?)"; exit 1; }
          grep -qE 'Page size:\s+3168 x 3168 pts' info.txt || { echo "::error::poster.pdf is not 44 x 44 in (3168 x 3168 pt)"; exit 1; }

      - name: Check fonts are embedded
        run: |
          pdffonts poster.pdf | tee fonts.txt
          ! tail -n +3 fonts.txt | awk '{print $(NF-4)}' | grep -qx 'no'

      - uses: actions/upload-artifact@v4
        with:
          name: poster-pdf
          path: poster.pdf

      - name: Commit rendered poster back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poster.pdf poster.typ
          if git diff --cached --quiet; then
            echo "poster.pdf and poster.typ already current"
          else
            git commit -m "Render poster [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Render poster

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render poster.qmd
        run: quarto render poster.qmd

      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Check page count and size
        run: |
          pdfinfo poster.pdf | tee info.txt
          grep -qE '^Pages:\s+1$' info.txt || { echo "::error::poster.pdf is not exactly one page (text overflowed?)"; exit 1; }
          grep -qE 'Page size:\s+3168 x 3168 pts' info.txt || { echo "::error::poster.pdf is not 44 x 44 in (3168 x 3168 pt)"; exit 1; }

      - name: Check fonts are embedded
        run: |
          pdffonts poster.pdf | tee fonts.txt
          ! tail -n +3 fonts.txt | awk '{print $(NF-4)}' | grep -qx 'no'

      - uses: actions/upload-artifact@v4
        with:
          name: poster-pdf
          path: poster.pdf

      - name: Commit rendered poster back to main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp poster.pdf "$RUNNER_TEMP/poster.pdf"
          cp poster.typ "$RUNNER_TEMP/poster.typ"
          for attempt in 1 2 3; do
            git fetch -q origin main
            # If main has newer source, our render is stale. That commit's own run will render it.
            if ! git diff --quiet HEAD origin/main -- . ':(exclude)poster.pdf' ':(exclude)poster.typ'; then
              echo "main has newer source; skipping, its own run will commit the render"
              exit 0
            fi
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/poster.pdf" poster.pdf
            cp "$RUNNER_TEMP/poster.typ" poster.typ
            git add poster.pdf poster.typ
            if git diff --cached --quiet; then
              echo "poster.pdf and poster.typ already current"
              exit 0
            fi
            git commit -q -m "Render poster [skip ci]"
            git push origin HEAD:main && exit 0
            echo "push raced with another run (attempt $attempt), retrying"
            sleep 3
          done
          exit 1
